owner: WeGotWorkspace
repo: status

sites:
  - name: Web app
    url: https://demo.wegotworkspace.com/
    expectedStatusCodes:
      - 200
  - name: API
    url: https://demo.wegotworkspace.com/api/v1/health
    expectedStatusCodes:
      - 200
  - name: File sync (WebDAV)
    url: https://demo.wegotworkspace.com/files/
    expectedStatusCodes:
      - 401
  - name: Calls (TURN)
    check: "tcp-ping"
    url: turn.wegotworkspace.com
    port: 3478
  - name: Monitoring
    url: https://alive.wegotworkspace.com/
    expectedStatusCodes:
      - 200

status-website:
  cname: status.wegotworkspace.com
  name: WeGotWorkspace status
  introTitle: "WeGotWorkspace status"
  introMessage: Live availability of the WeGotWorkspace platform, checked independently every five minutes.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
