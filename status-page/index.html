<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WeGotWorkspace status</title>
<meta name="description" content="Is WeGotWorkspace up? Live status and the last 90 days.">
<link rel="icon" href="favicon.svg">
<link rel="preload" href="fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url(fonts/PlusJakartaSans-Variable.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"We Got Serif";src:url(fonts/WeGotSerif-Regular.woff2) format("woff2");font-display:swap}
:root{--ink:#003311;--cream:#fff5e9;--bg:var(--cream);--fg:var(--ink);--muted:#51564e;--card:#fffbf5;--line:#e6dccb;
  --green:#16853b;--yellow:#ffc800;--orange:#ec7a12;--red:#b0101b;--none:#ddd5c6;--ok:#16853b;--bad:#b0101b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1216;--fg:#eef1f5;--muted:#9aa39c;--card:#161d24;--line:#2a343c;
  --green:#3fae5f;--yellow:#ffd23f;--orange:#f2841f;--red:#f0525a;--none:#2a343c;--ok:#16301d;--bad:#6b1218}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{background:var(--ink);color:var(--cream)}
header a{display:flex;align-items:center;gap:12px;max-width:880px;margin:auto;padding:14px 20px;color:inherit}
header svg{height:32px;width:auto;display:block}
main{max-width:880px;margin:auto;padding:0 20px 56px}
h1{font:400 clamp(44px,9vw,64px)/1.1 "We Got Serif",Georgia,serif;margin:36px 0 20px}
h2{font-size:18px;margin:40px 0 12px}
.banner{padding:16px 20px;border-radius:10px;font-weight:600;font-size:18px;color:#fff;background:var(--ok)}
.banner.down{background:var(--bad)}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 20px;margin:0;list-style:none}
.card>li{padding:18px 0;border-top:1px solid var(--line)}
.card>li:first-child{border-top:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.name{font-weight:600}
.now{font-weight:600;color:var(--green)}
.now.down{color:var(--red)}
.now::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:currentColor}
.bar{display:flex;gap:2px;height:34px;margin:10px 0 6px}
.bar span{flex:1;border-radius:2px;min-width:0}
.green{background:var(--green)}.yellow{background:var(--yellow)}.orange{background:var(--orange)}.none{background:var(--none)}
.red{background:repeating-linear-gradient(135deg,#0000 0 3px,#0006 3px 5px),var(--red)}
.axis,.when{color:var(--muted);font-size:13px}
.axis{display:flex;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#tip{position:absolute;z-index:1;pointer-events:none;background:var(--fg);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.incidents strong{display:block}
@media (max-width:600px){.bar span:nth-child(-n+60){display:none}.d90{display:none}}
@media (min-width:601px){.d30{display:none}}
</style>
</head>
<body>
<header><a href="https://www.wegotworkspace.com" aria-label="WeGotWorkspace">

<svg viewBox="0 0 178 60" aria-hidden="true"><path fill="currentColor" d="M5.661 26.616 0 .422h4.14l3.892 19.69L12.137.421h3.998l4.069 19.69L24.096.421h4.14l-5.661 26.194h-4.423L14.118 7.77l-4.034 18.846zm24.252 0V.422h14.012v4.22h-10.19v6.715h9.624v4.219h-9.624v6.82h10.19v4.22zm30.401.422C54.3 27.038 49.7 21.307 49.7 13.5 49.7 5.696 54.157 0 60.243 0c4.494 0 7.785 3.164 8.881 6.891l-3.432 2.04c-.813-2.708-2.76-4.571-5.449-4.571-3.963 0-6.687 3.692-6.687 9.141 0 5.485 2.795 9.177 6.758 9.177 3.185 0 5.98-2.496 5.98-6.504v-.106h-6.05v-4.043h9.907v2.637c0 8.121-4.848 12.376-9.837 12.376m22.556 0c-6.227 0-11.004-5.802-11.004-13.537S76.608 0 82.87 0c6.263 0 11.04 5.766 11.04 13.501 0 7.736-4.777 13.537-11.04 13.537m0-4.36c4.105 0 7.183-3.868 7.183-9.177 0-5.274-3.078-9.141-7.183-9.141-4.104 0-7.147 3.867-7.147 9.141 0 5.31 3.043 9.177 7.147 9.177m16.621 3.938V4.64h-5.449V.421h14.719v4.22h-5.378v21.975zM5.661 59.578 0 33.384h4.14l3.892 19.69 4.105-19.69h3.998l4.069 19.69 3.892-19.69h4.14l-5.661 26.194h-4.423l-4.034-18.845-4.034 18.845zM39.728 60c-6.228 0-11.004-5.801-11.004-13.536 0-7.736 4.74-13.502 11.004-13.502 6.262 0 11.04 5.766 11.04 13.502C50.767 54.199 45.99 60 39.727 60m0-4.36c4.104 0 7.182-3.867 7.182-9.176 0-5.274-3.078-9.142-7.182-9.142s-7.148 3.868-7.148 9.142c0 5.309 3.043 9.176 7.148 9.176m13.769 3.938V33.384h7.82c4.316 0 7.324 2.953 7.324 8.263 0 3.621-1.45 6.223-3.821 7.418l4.847 10.513h-4.352l-4.352-9.669h-3.645v9.67zm3.821-13.888h4.07c2.052 0 3.432-1.582 3.432-4.043s-1.38-4.044-3.432-4.044h-4.07zm14.2 13.888V33.384h3.82v11.638l7.927-11.638h4.847l-7.289 10.759 7.537 15.435h-4.53l-5.66-11.532-2.831 4.184v7.348zM97.247 60c-3.999 0-7.325-2.918-8.457-7.278l3.22-1.723c.99 3.024 3.043 4.817 5.449 4.817 2.017 0 3.326-1.266 3.326-3.2 0-1.547-.708-2.496-2.194-3.094l-4.033-1.617c-3.291-1.3-4.954-3.867-4.954-7.313 0-4.5 2.866-7.63 7.041-7.63 3.786 0 6.794 2.602 7.926 6.54l-3.185 1.758c-.813-2.602-2.582-4.114-4.74-4.114-1.947 0-3.256 1.301-3.256 3.235 0 1.441.743 2.602 2.3 3.2l3.857 1.511c3.361 1.336 5.059 3.727 5.059 7.243 0 4.5-3.007 7.665-7.36 7.665m10.104-.422V33.384h7.856c4.316 0 7.324 2.953 7.324 8.263 0 5.238-3.043 8.262-7.324 8.262h-4.034v9.67zm3.822-13.888h4.104c2.053 0 3.397-1.582 3.397-4.043s-1.344-4.044-3.397-4.044h-4.104zm10.357 13.888 7.254-26.194h4.989l7.289 26.194h-4.211l-1.486-5.626h-8.138l-1.557 5.626zm6.794-9.845h5.944l-2.972-11.04zM151.779 60c-6.05 0-10.544-5.731-10.544-13.536 0-7.806 4.459-13.502 10.544-13.502 4.493 0 7.784 3.165 8.881 6.891l-3.468 2.005c-.814-2.637-2.76-4.536-5.413-4.536-3.962 0-6.687 3.692-6.687 9.142 0 5.484 2.725 9.176 6.687 9.176 2.653 0 4.599-1.898 5.413-4.535l3.468 2.004c-1.097 3.727-4.388 6.891-8.881 6.891m11.294-.422V33.384h14.011v4.22h-10.19v6.715h9.624v4.219h-9.624v6.82h10.19v4.22z"/></svg>
</a></header>
<main>
<h1>Status.</h1>
<p class="banner" id="banner" role="status">Loading…</p>
<p class="note">Checked independently every five minutes. Days run midnight to midnight UTC.</p>
<h2>Last 90 days</h2>
<ul class="card" id="components"></ul>
<ul class="legend" id="legend"></ul>
<h2>Incidents</h2>
<ul class="card incidents" id="incidents"></ul>
</main>
<div id="tip" hidden></div>
<script>
// Day colours by minutes down that day: the first row whose upTo is not exceeded wins.
const LEVELS = [
  { upTo: 0, cls: 'green', label: 'No downtime' },
  { upTo: 4, cls: 'yellow', label: 'Under 5 minutes down' },
  { upTo: 60, cls: 'orange', label: '5 to 60 minutes down' },
  { upTo: Infinity, cls: 'red', label: 'Over an hour down' },
];
const DAY = 864e5, today = Math.floor(Date.now() / DAY), $ = (id) => document.getElementById(id);
const iso = (d) => new Date(d * DAY).toISOString().slice(0, 10);
const date = (d) => new Date(d * DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const mins = (m) => m < 120 ? `${m} minute${m === 1 ? '' : 's'}` : `${Math.floor(m / 60)} h ${m % 60} min`;
const short = (name) => name.replace(/\s*\(.*\)/, '');
const unavailable = (names, now) => {
  const list = names.map(short), plural = list.length > 1 || /s$/.test(list[0]);
  return `${list.join(', ').replace(/, ([^,]*)$/, ' and $1')} ${now ? (plural ? 'are' : 'is') : (plural ? 'were' : 'was')} unavailable`;
};

$('legend').innerHTML = [...LEVELS, { cls: 'none', label: 'No data' }]
  .map((l) => `<li><i class="${l.cls}"></i>${l.label}</li>`).join('');

fetch('status.json', { cache: 'no-cache' }).then((r) => r.json()).then(({ components, incidents }) => {
  const down = components.filter((c) => c.status === 'down').map((c) => c.name);
  $('banner').textContent = down.length ? `${unavailable(down, true)} right now.` : 'All systems operational.';
  $('banner').classList.toggle('down', down.length > 0);

  $('components').innerHTML = components.map((c) => {
    const start = Date.parse(c.start), first = Math.floor(start / DAY);
    let downtime = 0, cells = '';
    for (let d = today - 89; d <= today; d++) {
      const m = c.down[iso(d)] || 0, level = d >= first && LEVELS.find((l) => m <= l.upTo);
      if (level) downtime += m;
      const text = `${date(d)}: ${!level ? 'no data' : m ? `${mins(m)} down` : 'no downtime'}`;
      cells += `<span role="img" class="${level ? level.cls : 'none'}" aria-label="${text}"></span>`;
    }
    const monitored = (Date.now() - Math.max(start, (today - 89) * DAY)) / 6e4;
    const uptime = Math.max(0, 100 * (1 - downtime / monitored));
    return `<li><div class="row"><span class="name">${c.name}</span>
      <span class="now ${c.status === 'down' ? 'down' : ''}">${c.status === 'down' ? 'Down' : 'Up'}</span></div>
      <div class="bar">${cells}</div>
      <div class="axis"><span><span class="d90">90 days ago</span><span class="d30">30 days ago</span></span>
      <span>${uptime.toFixed(uptime === 100 ? 0 : 2)}% uptime</span><span>Today</span></div></li>`;
  }).join('');

  $('incidents').innerHTML = incidents.map((i) => {
    const end = i.end ? Date.parse(i.end) : Date.now(), m = Math.max(1, Math.round((end - Date.parse(i.start)) / 6e4));
    const when = new Date(i.start).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
    return `<li><strong>${unavailable([i.name], !i.end)}</strong>
      <span class="when">${when} · ${i.end ? `resolved after ${mins(m)}` : `ongoing for ${mins(m)}`}</span></li>`;
  }).join('') || '<li>No incidents in the last 90 days.</li>';
}, () => { $('banner').textContent = 'Status is unavailable right now, please try again shortly.'; });

addEventListener('pointerover', (e) => {
  const cell = e.target.closest('.bar span'), tip = $('tip');
  tip.hidden = !cell;
  if (!cell) return;
  tip.textContent = cell.getAttribute('aria-label');
  const r = cell.getBoundingClientRect();
  tip.style.left = `${Math.min(Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2), innerWidth - tip.offsetWidth - 8) + scrollX}px`;
  tip.style.top = `${r.top + scrollY - tip.offsetHeight - 8}px`;
});
</script>
</body>
</html>
